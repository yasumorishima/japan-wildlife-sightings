name: collect

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 JST 06:00
  workflow_dispatch:
    inputs:
      memo:
        description: "実行の意図"
        required: false
      publish:
        description: "Kaggle に今のデータで新しい版を出す（変化が無くても）"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths: ["collect.py", "validate.py", "collectors/**", "sources.json", ".github/workflows/collect.yml"]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Kaggle の版メモに書く「data/ を最後に変えた commit」を git log で引くため
          fetch-depth: 50
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pdftotext を入れる（PDF しか出していない県の表を読むのに要る）
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: python3 -m pip install -r requirements.txt
      - name: 取得して data/ を作り直す
        run: python3 collect.py
      - name: 生成物を検算する
        run: python3 validate.py
      - name: 地図ページ用のデータを作る
        run: python3 build_map.py
      - name: 変わっていれば commit する
        # push で走った時は commit しない。コードを直すたびに data の差分が
        # 別 commit で入り、手元の作業と毎回衝突するため。日次実行だけが書く。
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "変化なし"
          else
            git commit -m "data: 出没情報を更新"
            git push
          fi

      # Kaggle への公開。リポジトリ変数 KAGGLE_PUBLISH が true の時だけ動く（未設定なら何もしない）。
      # Kaggle の最新版のメモにある commit と data/ の最新 commit が違えば新しい版を出すので、
      # 失敗した日の分は翌日の実行で取り返す。データセットがまだ無ければ公開で新規作成する。
      - name: Kaggle の公開状況を確かめる
        id: kaggle
        if: github.event_name != 'push' && vars.KAGGLE_PUBLISH == 'true'
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          pip install -q kaggle==2.2.5 six  # kaggle は six を宣言せずに import する
          python3 kaggle_published.py yasunorim/japan-wildlife-sightings "$(git log -1 --format=%h -- data/)"
      - name: Kaggle に新しい版を出す
        if: steps.kaggle.outcome == 'success' && (inputs.publish || steps.kaggle.outputs.behind == 'true')
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -o pipefail
          python3 build_kaggle.py
          commit=$(git log -1 --format=%h -- data/)
          built=$(jq -r '.generated_at[:10]' data/summary.json)
          if [ "${{ steps.kaggle.outputs.exists }}" = "true" ]; then
            kaggle datasets version -p _kaggle -m "Data built $built (commit $commit)" 2>&1 | tee kaggle.log
          else
            kaggle datasets create -p _kaggle --public 2>&1 | tee kaggle.log
          fi
          # CLI は失敗を表示しても 0 で終わることがある
          if grep -qiE "error|unsuccessful" kaggle.log; then exit 1; fi
