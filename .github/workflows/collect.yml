name: collect

on:
  schedule:
    - cron: "0 21 * * *"   # 毎日 JST 06:00
  workflow_dispatch:
    inputs:
      memo:
        description: "実行の意図"
        required: false
  push:
    branches: [main]
    paths: ["collect.py", "validate.py", "collectors/**", "sources.json", ".github/workflows/collect.yml"]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install -r requirements.txt
      - name: 取得して data/ を作り直す
        run: python3 collect.py
      - name: 生成物を検算する
        run: python3 validate.py
      - name: 変わっていれば commit する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変化なし"
          else
            git commit -m "data: 出没情報を更新"
            git push
          fi
